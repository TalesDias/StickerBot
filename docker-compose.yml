services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - stickerbot-net

  bot:
    build:
      context: .
    image: stickerbot/app
    container_name: stickerbot
    restart: unless-stopped
    env_file:
      - .env
    # These override whatever .env says: inside the network the broker is
    # reachable by service name, and auth state belongs on the named volume.
    environment:
      - NODE_ENV=production
      - WA_AUTH_DIR=/data/auth
      - RABBIT_CONNECTION_URI=amqp://guest:guest@rabbitmq:5672
    volumes:
      - wa-auth:/data/auth
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - stickerbot-net

volumes:
  # Survives `docker compose down` and image rebuilds. Losing it means
  # re-pairing the device.
  wa-auth:
    name: stickerbot_wa_auth

networks:
  stickerbot-net:
    name: stickerbot-net
